# arcella/Cargo.toml
[workspace]
resolver = "2"
members = [
    "arcella",
    "arcella-core",
    "arcella-cli",
    "arcella-engine",
    "arcella-types",
    "arcella-wasmtime",
]

[workspace.package]
publish = false
authors = ["Alexey Rybakov", "ArcellaTeam"]
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/ArcellaTeam/arcella/"

[workspace.dependencies]
arcella-engine = "0.1.0"
arcella-types = "0.1.2"
arcella-wasmtime = "0.1.0"
flexicon = "0.1.0"
ministore = "0.1.4"
minisnap = "0.1.1"
ministate = "0.1.1"
anyhow = "1"
clap = { version = "4.5.54", features = ["derive"] }
derive_builder = "0.20"
dirs = "6"
futures = "0.3.31"
indexmap = "2.13"
ordered-float = { version = "5.1.0", features = ["serde"]}
regex = "1.12.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.24"
time = { version = "0.3.44", features = ["formatting", "std"] }
thiserror = "2.0.17"
tokio = { version = "1.49", features = ["signal", "rt-multi-thread", "net", "io-util", "fs", "macros", "time"] }
toml = "0.9.8"
toml_edit = "0.23.9"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json", "serde"] }
uuid = { version = "1.19", features = ["v4", "fast-rng"] }
#walmq = "0.0.1"
wasmtime = "40.0"
wasmtime-wasi = "40"
wat = "1.239"
