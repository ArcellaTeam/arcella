# arcella/Cargo.toml
[workspace]
resolver = "2"
members = [
    "arcella",
    "arcella-broker",
    "arcella-core",
    "arcella-cli",
    "arcella-types",
]

[workspace.package]
publish = false
authors = ["Alexey Rybakov", "ArcellaTeam"]
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/ArcellaTeam/arcella/"

[workspace.dependencies]
arcella-types = "0.1.1"
flexicon = "0.1.0"
ministore = "0.1.6"
minisnap = "0.1.1"
ministate = "0.1.1"
anyhow = "1"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
dashmap = "6.2"
derive_builder = "0.20"
dirs = "6"
futures = "0.3.33"
indexmap = "2.14.0"
ordered-float = { version = "5.3.0", features = ["serde"]}
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
time = { version = "0.3.54", features = ["formatting", "std"] }
thiserror = "2.0.19"
tokio = { version = "1", features = ["signal", "rt-multi-thread", "net", "io-util", "fs", "macros", "time", "sync"] }
toml = "0.9.8"
toml_edit = "0.23.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "serde"] }
uuid = { version = "1.24", features = ["v4", "fast-rng"] }
#walmq = "0.0.1"
wasmtime = "38.0"
wasmtime-wasi = "38"
wat = "1.254"
