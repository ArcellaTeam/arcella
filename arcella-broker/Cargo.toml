[package]
name = "arcella-broker"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "arcella_broker"
path = "src/lib.rs"

[[bin]]
name = "arcella-broker"
path = "src/bin/arcella-broker.rs"
required-features = ["server"]

[dependencies]
#arcella-types = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
#dirs = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"
serde = { workspace = true }
#serde_json = { workspace = true }


[features]
default = ["client"]
client = []
server = ["client"] 